<p>Ever needed to do a lot of work across lots of your github repos or simply back your repos up? It’s couldn’t be easier!</p>

<h2 id="step-1">Step 1.</h2>

<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>gem install github-backup
</code></pre></div></div>

<h2 id="step-2">Step 2.</h2>

<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>github-backup johnmclear
</code></pre></div></div>

<p>Replace johnmclear with your github username.</p>

<h2 id="step-3">Step 3.</h2>

<p>Profit</p>
