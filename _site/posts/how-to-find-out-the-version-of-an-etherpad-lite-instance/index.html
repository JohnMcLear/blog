<p>The git hash is stored in the HTTP Response headers.</p>

<p><a href="https://mclear.co.uk/wp-content/uploads/2013/01/red.png"><img src="images/red-550x384.png" alt="red" /></a></p>

<p>Open your browser (ff/chrome) F12 (developer tools) Network Look in the header responses. It will show the Git Hash of the current revision then look at http://github.com/ether/etherpad-lite to see which hash is relevant to which version.</p>
