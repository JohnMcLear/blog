<p>I often have problems debugging Etherpad Lite in IE mostly due to IE having a hideous way of relentlessly holding onto files in cache.. well today I figured out to stop that problem and it’s super easy.. In <em>Developer tools</em>, <strong>Click Cache –&gt; Always refresh from server</strong></p>
