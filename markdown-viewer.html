<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: #24292e;
        }
        pre {
            background-color: #f6f8fa;
            padding: 16px;
            overflow: auto;
            border-radius: 6px;
        }
        img {
            max-width: 100%;
        }
        a {
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="content">Loading...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mdPath = urlParams.get('file');

        if (mdPath) {
            fetch(mdPath)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    document.getElementById('content').innerHTML = marked.parse(text);
                    document.title = mdPath.split('/').pop();
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `<h1>Error</h1><p>${err.message}</p>`;
                });
        } else {
            document.getElementById('content').innerHTML = '<h1>Markdown Viewer</h1><p>Please specify a file in the URL, e.g., <code>?file=posts/my-post/index.md</code></p>';
        }
    </script>
</body>
</html>
