<p>Replacing the title in Etherpad Lite with Your own title is just a little command.</p>

<p>Open up custom/pad.js</p>

<p>Edit customStart to read..</p>

<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>customStart(){ document.title= "Your Title Here" }
</code></pre></div></div>

<p>To change the title for the start page just do the same in index.js</p>
