<p>When installing shibboleth 2+ on debian you may get the error</p>

<p><a href="http://www.google.co.uk/search?rlz=1C1GGLS_en-GBGB344GB344&amp;sourceid=chrome&amp;ie=UTF-8&amp;q=unable+to+find+XML-Security+header+files">unable to find XML-Security header files</a></p>

<p>This is due to a missing lib</p>

<p>Run the command: <strong>apt-get install libxml-security-c-dev</strong></p>

<p>And all your dreams will come true.</p>
