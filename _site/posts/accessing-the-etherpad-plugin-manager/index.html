<p>To access your Etherpad plugin manager visit <strong>http://yourdomain.com/ep/admin &lt;– you may need to alter port ie :9000</strong></p>

<p>When prompted type your password then click Configuration -&gt; Plugin Manager</p>

<p>The default password is password</p>
