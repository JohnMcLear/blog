<p><a href="https://mclear.co.uk/wp-content/uploads/2010/08/Untitled1.png"><img src="images/Untitled1.png" alt="" /></a> If you are using the javascript swfobject method for the hosted <a href="http://code.google.com/p/myavatareditor/">My Avatar Editor</a> object you can use this code to give your avatar a transparent background: [javascript] <script type="text/javascript"> //&lt;!\[CDATA\[ var avatarvalue = "&lt;?= $avatarid ?&gt;"; var avatarURL = "myavatarcharacter.swf?avatar=" + avatarvalue; swfobject.embedSWF(avatarURL, "avatarSWFContainer", "160", "200", "10.0.0", null, {hosted:"true"},{wmode:"transparent"}); function setFacialFeature(){ var avatarSWF = document.getElementById('avatarSWFContainer'); avatarSWF.draw(); } //\]\]&gt; </script> [/javascript]</p>

<p>The only bit you need to change from the default code is the parameter which is the <strong>{wmode:”transparent”}</strong> bit</p>
