<p>Changing the font size of the time slider pad view is very simple.</p>

<p>You have to edit</p>

<p><strong>/usr/local/etherpad/trunk/etherpad/src/static/css/broadcast.css</strong></p>

<p>find<br />
<strong>#padmain {</strong></p>

<p>in the #padmain style section</p>

<p>replace<br />
<strong>font-size: 1.2em;</strong></p>

<p>with<br />
<strong>font-size: 1.5em;</strong></p>

<p>or whatever font size you want</p>

<p>Save and exit.</p>
