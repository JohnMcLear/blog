<p><a href="http://primaryblogger.co.uk">PrimaryBlogger</a> has Classdroid Support by default but if your blog isn’t with PrimaryBlogger then you have to tick a box in Wordpress:</p>

<ol>
  <li>Log into your blog</li>
  <li>Click settings -&gt; writing</li>
  <li>Scroll to the bottom and tick XML-RPC</li>
</ol>

<p>Save your settings and Classdroid should work!</p>
