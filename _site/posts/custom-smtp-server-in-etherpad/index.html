<p>To set a custom SMTP server in etherpad visit your config file (usually /etc/local.etherpad.properties) and add the line:</p>

<p><code class="language-plaintext highlighter-rouge">smtpServer = yourserver</code></p>

<p>For example</p>

<p><code class="language-plaintext highlighter-rouge">smtpServer = mail.whatever.com</code></p>
